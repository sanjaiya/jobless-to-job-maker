<!DOCTYPE html>
<html>

<head>
    <title>Interview Readiness Result</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="result-box">

        <h1>Interview Readiness Result</h1>

        <p>Your Score</p>

        <div class="score">
            {{ score }}/5
        </div>

        {% if score >= 4 %}

            <div class="message">
                🎉 You are ready for the interview!
            </div>

        {% elif score >= 3 %}

            <div class="message">
                👍 You are almost ready. Keep practicing!
            </div>

        {% else %}

            <div class="message">
                💪 Keep practicing and improve your confidence!
            </div>

        {% endif %}

        <br>

        <a href="{% url 'interview_readiness' %}" class="result-btn">
            Try Again
        </a>

        <a href="{% url 'dashboard' %}" class="result-btn">
            Dashboard
        </a>

    </div>

</body>

</html>
