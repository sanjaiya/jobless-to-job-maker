<!DOCTYPE html>
<html>

<head>
    <title>Technical Assessment Result</title>
</head>

<body>

    <h1>Technical Assessment Result</h1>

    <h2>Your Score: {{ score }} / 5</h2>

    {% if score >= 4 %}

    <p style="color: green;">
        Excellent! You have good technical knowledge.
    </p>

    {% elif score >= 3 %}

    <p style="color: orange;">
        Good! Keep practicing your technical skills.
    </p>

    {% else %}

    <p style="color: red;">
        Keep practicing and improve your technical knowledge.
    </p>

    {% endif %}

    <br>

    <a href="{% url 'technical_assessment' %}">
        <button>Try Again</button>
    </a>

    <br><br>

    <a href="{% url 'dashboard' %}">
        <button>Back to Dashboard</button>
    </a>

</body>

</html>
